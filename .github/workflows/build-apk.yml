name: Build SAYMA Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, mobile-ui-gps-polish-20261122, sayma-webview-online-offline-20261122, sayma-apk-build-20261123 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Package complete Android source
        run: |
          zip -r SAYMA-Android-Source.zip . \
            -x ".git/*" ".gradle/*" "app/build/*" "SAYMA-Android-Source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SAYMA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SAYMA-Android-Source
          path: SAYMA-Android-Source.zip
