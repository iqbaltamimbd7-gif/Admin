name: Build SAYMA Admin and Worker APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-two-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Admin APK
        run: gradle --no-daemon -p admin-app assembleDebug

      - name: Build Worker APK
        run: gradle --no-daemon -p worker-app assembleDebug

      - name: Prepare APK files
        run: |
          mkdir -p dist
          cp admin-app/app/build/outputs/apk/debug/app-debug.apk dist/SAYMA-ADMIN-debug.apk
          cp worker-app/app/build/outputs/apk/debug/app-debug.apk dist/SAYMA-WORKER-debug.apk

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: SAYMA-ADMIN-AND-WORKER-APKS
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
